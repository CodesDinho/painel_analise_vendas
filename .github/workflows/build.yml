name: Build painel-analise-vendas

concurrency:
  group: painel-analise-vendas-gitops
  cancel-in-progress: false

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.4
      - name: Testar
        run: python -m pytest -q
      - name: Validar sintaxe do Compose
        run: |
          ANALISE_VENDAS_FIREBIRD_HOST=validation \
          ANALISE_VENDAS_FIREBIRD_DATABASE=validation \
          ANALISE_VENDAS_FIREBIRD_USER=validation \
          ANALISE_VENDAS_FIREBIRD_PASSWORD=validation \
          docker compose -f compose.yml config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/codesdinho/painel-analise-vendas:latest
            ghcr.io/codesdinho/painel-analise-vendas:sha-${{ github.sha }}

  update-compose:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Atualizar tag imutável no Compose
        env:
          IMAGE: ghcr.io/codesdinho/painel-analise-vendas:sha-${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("compose.yml")
          content = path.read_text(encoding="utf-8")
          replacement = "    image: $" + "{" + f"PAINEL_ANALISE_VENDAS_IMAGE:-{os.environ['IMAGE']}" + "}"
          updated, count = re.subn(r"(?m)^    image:.*$", replacement, content, count=1)
          if count != 1:
              raise SystemExit("referência de imagem não encontrada")
          path.write_text(updated, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compose.yml
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza painel para sha-${GITHUB_SHA} [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
