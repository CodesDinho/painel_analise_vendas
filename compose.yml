services:
  painel-analise-vendas:
    build:
      context: .
    image: ${PAINEL_ANALISE_VENDAS_IMAGE:-ghcr.io/codesdinho/painel-analise-vendas:latest}
    container_name: painel-analise-vendas
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PAINEL_PORT:-8520}:8520"
    volumes:
      - ./cache:/app/cache
      - ./temporarios:/app/temporarios
      - ./dados_locais:/app/dados_locais
      - ./relatorios:/app/relatorios
      - ./dados_operacionais:/app/dados_operacionais:ro
      - ./credentials:/app/credentials:ro
      - ./config_runtime:/app/config_runtime:ro
    networks:
      - default
      - combo_audit_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8520/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 2g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  combo_audit_internal:
    external: true
    name: combo-audit-internal
