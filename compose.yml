services:
  painel-analise-vendas:
    image: ${PAINEL_ANALISE_VENDAS_IMAGE:-ghcr.io/codesdinho/painel-analise-vendas:sha-618d8b33e53132e7263b3a6c4c23e358c5ae269e}
    container_name: painel-analise-vendas
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      ANALISE_VENDAS_COMBO_AUDIT_API_URL: ${ANALISE_VENDAS_COMBO_AUDIT_API_URL:-http://slack-combos:8080}
      ANALISE_VENDAS_COMBO_AUDIT_API_TOKEN: ${ANALISE_VENDAS_COMBO_AUDIT_API_TOKEN:-}
      ANALISE_VENDAS_COMBO_AUDIT_API_TIMEOUT: ${ANALISE_VENDAS_COMBO_AUDIT_API_TIMEOUT:-45}
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/credential.json
      ANALISE_VENDAS_GCP_PROJECT: ${ANALISE_VENDAS_GCP_PROJECT:-dinho-dw}
      ANALISE_VENDAS_USUARIOS_PATH: /app/config_runtime/usuarios.json
      ANALISE_VENDAS_USUARIOS_FATURAMENTO_PATH: /app/config_runtime/usuarios_faturamento.json
      ANALISE_VENDAS_CONFIG_FIREBIRD: /run/secrets/combo_config.ini
    ports:
      - "${PAINEL_PORT:-8520}:8520"
    volumes:
      - ${PAINEL_HOST_ROOT:-/home/administrator/Desktop/codes/Painel_analise_vendas}/cache:/app/cache
      - ${PAINEL_HOST_ROOT:-/home/administrator/Desktop/codes/Painel_analise_vendas}/temporarios:/app/temporarios
      - ${PAINEL_HOST_ROOT:-/home/administrator/Desktop/codes/Painel_analise_vendas}/dados_locais:/app/dados_locais
      - ${PAINEL_HOST_ROOT:-/home/administrator/Desktop/codes/Painel_analise_vendas}/relatorios:/app/relatorios
      - ${PAINEL_HOST_ROOT:-/home/administrator/Desktop/codes/Painel_analise_vendas}/dados_operacionais:/app/dados_operacionais:ro
      - ${PAINEL_HOST_ROOT:-/home/administrator/Desktop/codes/Painel_analise_vendas}/credentials:/app/credentials:ro
      - ${PAINEL_HOST_ROOT:-/home/administrator/Desktop/codes/Painel_analise_vendas}/config_runtime:/app/config_runtime:ro
      - /home/administrator/Desktop/codes/ti_dinho_slack/secrets/combo_config.ini:/run/secrets/combo_config.ini:ro
    networks:
      - default
      - combo_audit_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8520/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 2g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  combo_audit_internal:
    external: true
    name: combo-audit-internal
